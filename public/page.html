<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ryzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-l:#E2C27D;--gold-d:#9E7C2E;
  --black:#0D0D0D;--dark:#111;--dark2:#1A1A1A;
  --bone:#F5F3EE;--bone2:#EDE8DF;--white:#fff;
  --gray:#888;--gray2:#ccc;--t:.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--white);color:var(--dark)}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto}

.logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;letter-spacing:7px;color:var(--gold);text-transform:uppercase}

#hdr{background:var(--white);border-bottom:1px solid rgba(0,0,0,.07);position:sticky;top:0;z-index:900}
.hdr-in{max-width:1000px;margin:0 auto;padding:0 28px;height:66px;display:flex;align-items:center;justify-content:space-between}
.back-link{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dark);transition:color var(--t)}
.back-link:hover{color:var(--gold)}

main{max-width:760px;margin:0 auto;padding:64px 28px 100px}
.page-eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.page-title{font-family:'Montserrat',sans-serif;font-size:clamp(28px,4vw,42px);font-weight:900;text-transform:uppercase;line-height:1.1;margin-bottom:36px}
.page-body{font-size:15px;line-height:1.9;color:#333}
.page-body h1,.page-body h2,.page-body h3{font-family:'Montserrat',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:32px 0 14px}
.page-body p{margin-bottom:16px}
.page-body img{margin:24px 0}
.page-body a{color:var(--gold-d);text-decoration:underline}

.block{margin-bottom:40px}
.block-h{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--dark);margin-bottom:10px}
.block-b{font-size:14.5px;line-height:1.85;color:#333;white-space:pre-wrap}

/* ── typed section blocks ── */
.blk-hero{background:var(--dark);color:var(--bone);padding:56px 40px;margin:0 -28px 40px;text-align:center}
.blk-hero-eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.blk-hero-h{font-family:'Montserrat',sans-serif;font-size:clamp(24px,4vw,36px);font-weight:900;text-transform:uppercase;margin-bottom:14px}
.blk-hero-sub{font-size:13.5px;color:rgba(245,243,238,.7);max-width:520px;margin:0 auto 22px;line-height:1.7}
.blk-hero img{max-width:100%;border-radius:4px;margin-top:20px}
.blk-image{margin-bottom:40px}
.blk-image img{width:100%;border-radius:4px}
.blk-image .cap{font-size:11.5px;color:var(--gray);margin-top:8px;text-align:center}
.blk-divider{border:none;border-top:1px solid rgba(0,0,0,.1);margin:40px 0}
.blk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:40px}
.blk-grid-card{border:1px solid rgba(0,0,0,.08);border-radius:6px;overflow:hidden;color:inherit}
.blk-grid-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f2f2f2}
.blk-grid-card .gc-name{font-size:12px;padding:8px 10px 2px}
.blk-grid-card .gc-price{font-size:12px;color:var(--gold-d);padding:0 10px 10px;font-weight:600}
.blk-testi{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:40px}
.blk-testi-card{background:#faf9f6;border:1px solid rgba(0,0,0,.06);border-radius:6px;padding:20px}
.blk-testi-q{font-size:13.5px;line-height:1.7;color:#333;font-style:italic;margin-bottom:10px}
.blk-testi-a{font-size:11.5px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.blk-faq-item{border-bottom:1px solid rgba(0,0,0,.08);padding:16px 0}
.blk-faq-q{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;margin-bottom:8px}
.blk-faq-a{font-size:13.5px;line-height:1.7;color:#333}
.blk-newsletter{background:#faf9f6;border:1px solid rgba(0,0,0,.06);border-radius:6px;padding:32px;text-align:center;margin-bottom:40px}
.blk-newsletter .btn{margin-top:16px}
.blk-countdown{text-align:center;margin-bottom:40px}
.blk-countdown-nums{display:flex;justify-content:center;gap:18px;margin-top:14px}
.blk-countdown-num{font-family:'Montserrat',sans-serif;font-size:28px;font-weight:900;color:var(--gold-d)}
.blk-countdown-lbl{font-size:9.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em}
.blk-video{position:relative;margin-bottom:40px;border-radius:4px;overflow:hidden}
.blk-video video{width:100%;display:block}
.blk-video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.blk-video-h{color:#fff;font-family:'Montserrat',sans-serif;font-size:clamp(20px,3vw,30px);font-weight:900;text-transform:uppercase;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.5)}

.state-msg{text-align:center;padding:120px 20px}
.state-eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.state-title{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;margin-bottom:14px}
.state-p{font-size:13px;color:var(--gray);margin-bottom:26px}
.btn{display:inline-flex;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px 28px;background:var(--gold);color:var(--black);border:2px solid var(--gold);transition:var(--t)}
.btn:hover{background:var(--gold-l);border-color:var(--gold-l)}

footer{background:var(--dark2);padding:40px 28px;text-align:center;color:rgba(245,243,238,.5);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>

<header id="hdr">
  <div class="hdr-in">
    <a href="/" class="logo" style="font-size:20px;letter-spacing:5px">Ryzen</a>
    <a href="/" class="back-link">&larr; Back to Shop</a>
  </div>
</header>

<main id="content">
  <div class="state-msg">
    <div class="state-eyebrow">Loading</div>
    <div class="state-title">Please wait…</div>
  </div>
</main>

<footer>&copy; <span id="fyear"></span> Ryzen. All rights reserved.</footer>

<script>
document.getElementById('fyear').textContent = new Date().getFullYear();

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderNotFound() {
  document.title = 'Page Not Found — Ryzen';
  document.getElementById('content').innerHTML =
    '<div class="state-msg">' +
      '<div class="state-eyebrow">404</div>' +
      '<div class="state-title">Page Not Found</div>' +
      '<div class="state-p">The page you\'re looking for doesn\'t exist or may have been removed.</div>' +
      '<a href="/" class="btn">Return Home</a>' +
    '</div>';
}

function renderError() {
  document.title = 'Ryzen';
  document.getElementById('content').innerHTML =
    '<div class="state-msg">' +
      '<div class="state-eyebrow">Error</div>' +
      '<div class="state-title">Something Went Wrong</div>' +
      '<div class="state-p">We could not load this page right now. Please try again shortly.</div>' +
      '<a href="/" class="btn">Return Home</a>' +
    '</div>';
}

// ── typed section renderers ──
// Each renderer takes a block object and returns an HTML string. Unknown
// or malformed blocks are skipped rather than breaking the whole page.
function escAttr(s) { return escapeHtml(s); }

function renderBlockText(b) {
  return '<div class="block">' +
    (b.heading ? '<div class="block-h">' + escapeHtml(b.heading) + '</div>' : '') +
    '<div class="block-b">' + escapeHtml(b.body || '') + '</div>' +
  '</div>';
}

function renderBlockHero(b) {
  return '<div class="blk-hero">' +
    (b.eyebrow ? '<div class="blk-hero-eyebrow">' + escapeHtml(b.eyebrow) + '</div>' : '') +
    (b.heading ? '<div class="blk-hero-h">' + escapeHtml(b.heading) + '</div>' : '') +
    (b.body ? '<div class="blk-hero-sub">' + escapeHtml(b.body) + '</div>' : '') +
    (b.buttonText && b.buttonLink ? '<a class="btn" href="' + escAttr(b.buttonLink) + '">' + escapeHtml(b.buttonText) + '</a>' : '') +
    (b.image ? '<img src="' + escAttr(b.image) + '" alt="' + escAttr(b.heading || '') + '" loading="lazy"/>' : '') +
  '</div>';
}

function renderBlockImage(b) {
  if (!b.image) return '';
  var img = '<img src="' + escAttr(b.image) + '" alt="' + escAttr(b.alt || '') + '" loading="lazy"/>';
  return '<div class="blk-image">' +
    (b.link ? '<a href="' + escAttr(b.link) + '">' + img + '</a>' : img) +
    (b.caption ? '<div class="cap">' + escapeHtml(b.caption) + '</div>' : '') +
  '</div>';
}

function renderBlockDivider() { return '<hr class="blk-divider"/>'; }

function renderBlockTestimonials(b) {
  var items = Array.isArray(b.items) ? b.items : [];
  if (!items.length) return '';
  return '<div class="block">' +
    (b.heading ? '<div class="block-h">' + escapeHtml(b.heading) + '</div>' : '') +
    '<div class="blk-testi">' +
    items.map(function(it) {
      return '<div class="blk-testi-card"><div class="blk-testi-q">"' + escapeHtml(it.quote || '') + '"</div>' +
        '<div class="blk-testi-a">' + escapeHtml(it.author || '') + '</div></div>';
    }).join('') +
    '</div></div>';
}

function renderBlockFaq(b) {
  var items = Array.isArray(b.items) ? b.items : [];
  if (!items.length) return '';
  return '<div class="block">' +
    (b.heading ? '<div class="block-h">' + escapeHtml(b.heading) + '</div>' : '') +
    items.map(function(it) {
      return '<div class="blk-faq-item"><div class="blk-faq-q">' + escapeHtml(it.q || '') + '</div>' +
        '<div class="blk-faq-a">' + escapeHtml(it.a || '') + '</div></div>';
    }).join('') +
  '</div>';
}

function renderBlockNewsletter(b) {
  return '<div class="blk-newsletter">' +
    (b.heading ? '<div class="block-h">' + escapeHtml(b.heading) + '</div>' : '') +
    (b.body ? '<div class="block-b">' + escapeHtml(b.body) + '</div>' : '') +
    '<button type="button" class="btn" disabled title="Newsletter signup is not wired up to a backend yet">' + escapeHtml(b.buttonText || 'Subscribe') + '</button>' +
  '</div>';
}

function renderBlockCountdown(b) {
  var id = 'cd-' + Math.random().toString(36).slice(2);
  setTimeout(function() { startCountdown(id, b.targetDate); }, 0);
  return '<div class="blk-countdown">' +
    (b.heading ? '<div class="block-h">' + escapeHtml(b.heading) + '</div>' : '') +
    '<div class="blk-countdown-nums" id="' + id + '">' +
      ['Days', 'Hours', 'Mins', 'Secs'].map(function(l) {
        return '<div><div class="blk-countdown-num">--</div><div class="blk-countdown-lbl">' + l + '</div></div>';
      }).join('') +
    '</div></div>';
}

function startCountdown(id, targetDate) {
  var el = document.getElementById(id);
  if (!el || !targetDate) return;
  var target = new Date(targetDate).getTime();
  if (isNaN(target)) return;
  function tick() {
    var diff = target - Date.now();
    var nums = el.querySelectorAll('.blk-countdown-num');
    if (diff <= 0) {
      nums.forEach(function(n) { n.textContent = '0'; });
      clearInterval(timer);
      return;
    }
    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    var vals = [d, h, m, s];
    nums.forEach(function(n, i) { n.textContent = String(vals[i]); });
  }
  tick();
  var timer = setInterval(tick, 1000);
}

function renderBlockVideoBanner(b) {
  if (!b.videoUrl) return '';
  return '<div class="blk-video">' +
    '<video src="' + escAttr(b.videoUrl) + '"' + (b.poster ? ' poster="' + escAttr(b.poster) + '"' : '') + ' autoplay muted loop playsinline></video>' +
    (b.heading ? '<div class="blk-video-overlay"><div class="blk-video-h">' + escapeHtml(b.heading) + '</div></div>' : '') +
  '</div>';
}

function renderBlockProductGrid(b, productsPromise) {
  var wrapId = 'pg-' + Math.random().toString(36).slice(2);
  productsPromise.then(function(products) {
    var el = document.getElementById(wrapId);
    if (!el) return;
    var filtered = products;
    if (b.category) filtered = filtered.filter(function(p) { return p.cat === b.category; });
    if (b.limit) filtered = filtered.slice(0, Number(b.limit) || filtered.length);
    if (!filtered.length) { el.innerHTML = ''; return; }
    el.innerHTML = filtered.map(function(p) {
      return '<a class="blk-grid-card" href="/#shop">' +
        '<img src="' + escAttr(p.image) + '" alt="' + escAttr(p.name) + '" loading="lazy"/>' +
        '<div class="gc-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="gc-price">\u20B9' + Number(p.price || 0).toLocaleString('en-IN') + '</div>' +
      '</a>';
    }).join('');
  }).catch(function() {});
  return '<div class="block">' +
    (b.heading ? '<div class="block-h">' + escapeHtml(b.heading) + '</div>' : '') +
    '<div class="blk-grid" id="' + wrapId + '"></div>' +
  '</div>';
}

function renderBlockCustomHtml(b) {
  // Trusted content: only a Super Admin can save a custom_html block
  // (enforced server-side in api/pages.js), so it's rendered as-is here,
  // same trust level as static-page HTML.
  return '<div class="block">' + (b.html || '') + '</div>';
}

var productsPromiseCache = null;
function getProducts() {
  if (!productsPromiseCache) {
    productsPromiseCache = fetch('/api/products?action=list')
      .then(function(r) { return r.ok ? r.json() : { products: [] }; })
      .then(function(d) { return Array.isArray(d.products) ? d.products : []; })
      .catch(function() { return []; });
  }
  return productsPromiseCache;
}

function renderBlock(b) {
  switch (b.type) {
    case 'hero': return renderBlockHero(b);
    case 'image': return renderBlockImage(b);
    case 'divider': return renderBlockDivider(b);
    case 'testimonials': return renderBlockTestimonials(b);
    case 'faq': return renderBlockFaq(b);
    case 'newsletter': return renderBlockNewsletter(b);
    case 'countdown': return renderBlockCountdown(b);
    case 'video_banner': return renderBlockVideoBanner(b);
    case 'product_grid': return renderBlockProductGrid(b, getProducts());
    case 'custom_html': return renderBlockCustomHtml(b);
    case 'text':
    default: return renderBlockText(b);
  }
}

function renderPage(page) {
  document.title = page.title + ' — Ryzen';
  var html = '<p class="page-eyebrow">Ryzen</p><h1 class="page-title">' + escapeHtml(page.title) + '</h1>';

  if (page.type === 'dynamic' && Array.isArray(page.blocks) && page.blocks.length) {
    html += page.blocks.map(renderBlock).join('');
  } else if (page.type === 'dynamic') {
    // no blocks yet — nothing to show below the title
  } else {
    // Static pages store trusted HTML entered by the admin — rendered as-is.
    html += '<div class="page-body">' + (page.html || '') + '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

(function loadPage() {
  var slug = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
  if (!slug) { renderNotFound(); return; }

  fetch('/api/pages?action=get&slug=' + encodeURIComponent(slug))
    .then(function(res) {
      // pages.js returns a real 404 when the slug has no match. Any other
      // non-OK status (500, etc.) is treated as "not found" here too,
      // rather than surfacing a hard error for what's usually a bad link.
      if (!res.ok) { renderNotFound(); return null; }
      return res.json();
    })
    .then(function(data) {
      if (!data) return;
      if (!data.page) { renderNotFound(); return; }
      renderPage(data.page);
    })
    .catch(function() { renderError(); });
})();
</script>

</body>
</html>
