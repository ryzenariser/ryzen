<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#011207" />
<title>CTO Dashboard — Razariser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css" />
<style>
/* Palette: Near-Black Green #011207 page, Dark Forest Green #012F13 surfaces, Soft Sage Mint #E2F0CC text
   and the live-graph panel, Apple Green #8BC53D accent. Amber and coral are only for warning and failure. */
:root{--cto-bg:#011207;--cto-card:#012F13;--cto-mint:#E2F0CC;--cto-apple:#8BC53D;--cto-warn:#F0C24B;--cto-bad:#FF7A6B;--cto-line:rgba(226,240,204,.14);--cto-dim:rgba(226,240,204,.68)}
html{color-scheme:dark}
html,body,#rd-app{background:var(--cto-bg)!important;color:var(--cto-mint)}
::selection{background:var(--cto-apple);color:var(--cto-bg)}
#cto-root{max-width:1200px;margin:0 auto;padding:0 0 40px;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
#cto-root h2,#cto-root p,#cto-root dl,#cto-root dd{margin:0}
.t-ok{--tone:var(--cto-apple)}
.t-warn{--tone:var(--cto-warn)}
.t-bad{--tone:var(--cto-bad)}

.cto-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 16px;font-size:13px;color:var(--cto-dim)}
.cto-sp{flex:1}
.cto-live{display:inline-flex;align-items:center;gap:8px;color:var(--cto-mint)}
.cto-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cto-apple)}
.cto-dot.on{animation:cto-pulse 2s infinite}
.cto-dot.err{background:var(--cto-bad)}
.cto-dot.off{background:var(--cto-dim)}
@keyframes cto-pulse{0%{box-shadow:0 0 0 0 rgba(139,197,61,.55)}100%{box-shadow:0 0 0 8px rgba(139,197,61,0)}}
.cto-btn,.cto-tab{font:inherit;font-size:13px;font-weight:500;color:var(--cto-mint);background:transparent;border:1px solid rgba(226,240,204,.3);border-radius:8px;padding:6px 14px;min-height:36px;cursor:pointer}
.cto-btn:hover{background:rgba(226,240,204,.08)}
.cto-btn:focus-visible,.cto-tab:focus-visible{outline:2px solid var(--cto-apple);outline-offset:2px}
.cto-btn.go{background:var(--cto-apple);border-color:var(--cto-apple);color:var(--cto-bg);font-weight:600}
.cto-btn.go:hover{background:#9bd14c}

.cto-hero{background:var(--cto-card);border:1px solid var(--cto-line);border-left:4px solid var(--tone);border-radius:14px;padding:16px 20px;margin:0 0 16px}
.cto-hero h2{font:700 22px/1.25 'Playfair Display',Georgia,serif}
.cto-hero p{margin-top:4px;color:var(--cto-dim)}
.cto-issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.cto-issues li{position:relative;padding-left:18px}
.cto-issues li:before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--tone)}

.cto-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.cto-tile{display:flex;flex-direction:column;gap:2px;background:var(--cto-card);border:1px solid var(--cto-line);border-radius:14px;padding:14px 16px;box-shadow:inset 3px 0 0 var(--tone,transparent)}
.cto-tl,.cto-ts{font-size:12px;color:var(--cto-dim)}
.cto-tv{font-size:22px;font-weight:600;line-height:1.25;color:var(--tone,var(--cto-mint))}
.cto-sec .cto-tile{background:rgba(1,18,7,.55)}
.cto-sec .cto-tiles{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}

.cto-sec{background:var(--cto-card);border:1px solid var(--cto-line);border-radius:16px;padding:18px 20px;margin:0 0 16px;min-width:0}
.cto-sec>header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin:0 0 14px}
.cto-sec h2{font:700 18px/1.3 'Playfair Display',Georgia,serif}
.cto-sec>header p{font-size:12px;color:var(--cto-dim)}
.cto-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin:0 0 16px}
.cto-cols>.cto-sec{margin:0}

/* The live graph sits on the light palette colour so it is the focal point of the page. */
.cto-sec.light{background:var(--cto-mint);color:var(--cto-card);border-color:transparent}
.light>header p{color:rgba(1,47,19,.7)}
.cto-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.cto-tab{border-radius:999px}
.light .cto-tab{color:var(--cto-card);border-color:rgba(1,47,19,.35)}
.light .cto-tab:hover{background:rgba(1,47,19,.08)}
.light .cto-tab[aria-pressed="true"]{background:var(--cto-card);border-color:var(--cto-card);color:var(--cto-mint)}
.light .cto-tab:focus-visible{outline-color:var(--cto-card)}
.cto-plot{position:relative;height:200px;touch-action:pan-y;border-bottom:1px solid rgba(1,47,19,.35);background:linear-gradient(rgba(1,47,19,.12) 1px,transparent 1px) 0 0/100% 25%}
.cto-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cto-plot path{vector-effect:non-scaling-stroke}
.cto-ln{fill:none;stroke:var(--cto-card);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cto-ar{fill:var(--cto-apple);opacity:.5;stroke:none}
.cto-pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cto-card);box-shadow:0 0 0 4px rgba(139,197,61,.7)}
.cto-x{position:absolute;bottom:0;width:2px;height:14px;background:#C8372D}
.cto-cur{position:absolute;top:0;bottom:0;width:1px;background:var(--cto-card);opacity:.4;pointer-events:none}
.cto-tip{position:absolute;top:6px;z-index:2;padding:5px 9px;border-radius:6px;background:var(--cto-bg);color:var(--cto-mint);font-size:12px;white-space:nowrap;pointer-events:none}
.cto-tip[hidden],.cto-cur[hidden]{display:none}
.cto-yl{position:absolute;left:4px;font-size:11px;opacity:.7}
.cto-xl{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;opacity:.7}
.cto-bars{display:flex;align-items:flex-end;gap:3px;height:200px;border-bottom:1px solid rgba(1,47,19,.35)}
.cto-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.cto-seg{display:block;background:var(--cto-card);border-radius:2px 2px 0 0}
.cto-seg.f{background:#C8372D}
.cto-kpis{display:flex;flex-wrap:wrap;gap:10px 28px;margin:14px 0 0}
.cto-kpis dt{font-size:12px;opacity:.7}
.cto-kpis dd{margin:2px 0 0;font-size:20px;font-weight:600}

.cto-wrap{overflow-x:auto}
.cto-tbl{width:100%;border-collapse:collapse;font-size:13px}
.cto-tbl th{padding:0 10px 8px 0;text-align:left;font-size:12px;font-weight:500;color:var(--cto-dim);white-space:nowrap}
.cto-tbl td{padding:10px 10px 10px 0;border-top:1px solid var(--cto-line);vertical-align:top;overflow-wrap:anywhere}
.cto-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--tone);background:color-mix(in srgb,var(--tone) 16%,transparent);border:1px solid color-mix(in srgb,var(--tone) 40%,transparent)}
.cto-link{color:var(--cto-apple);text-decoration:underline;text-underline-offset:3px}
.cto-note,.cto-empty{color:var(--cto-dim)}
.cto-empty{padding:20px 0;text-align:center}
.light .cto-empty{color:rgba(1,47,19,.7)}
.cto-br{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:0 0 12px}
.cto-br>span{grid-column:1/-1;font-size:13px;overflow-wrap:anywhere}
.cto-bt{height:8px;border-radius:99px;background:rgba(226,240,204,.1);overflow:hidden}
.cto-bt i{display:block;height:100%;border-radius:99px;background:var(--tone,var(--cto-apple))}
.cto-br b{font-weight:600}

@media (max-width:640px){.cto-plot,.cto-bars{height:160px}.cto-sec{padding:16px}.cto-hero{padding:14px 16px}.cto-sp{display:none}}
@media (prefers-reduced-motion:reduce){.cto-dot.on{animation:none}}
</style>
</head>
<body>
<div id="rd-app"></div>
<script src="_shared.js"></script>
<script>
// CTO dashboard. Data comes from Roles-dashboard.js/CTO.js via
// /api/admin?action=role-dashboard — this file only decides how it looks.
// Live mode re-runs the dashboard request RD.boot already makes (same URL, same auth),
// so nothing here needs to know how sign-in tokens are handled.
(function () {
  'use strict';
  var R = RD, num = R.num, ago = R.ago;
  var esc = function (s) { return R.esc(s == null ? '' : String(s)); };
  var HOUR = 3600000, MAX = 90;
  var st = { buf: [], tab: 'lat', every: 30, paused: false, fails: 0, at: 0, d: null, busy: false, timer: 0, wired: false, noLive: false };
  var $ = function (id) { return document.getElementById(id); };
  var cap = function (s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };
  var hm = function (t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  var dtone = function (s) { return s === 'READY' ? 'ok' : s === 'ERROR' ? 'bad' : 'warn'; };

  // ---- small view helpers (self-contained so the palette applies everywhere) -------------
  var raw = function (s) { return { h: s }; };
  var pill = function (t, tone) { return '<span class="cto-pill t-' + tone + '">' + esc(t) + '</span>'; };
  var tile = function (l, v, s, tone) {
    return '<div class="cto-tile' + (tone ? ' t-' + tone : '') + '"><span class="cto-tl">' + esc(l) + '</span><b class="cto-tv">' + esc(v) + '</b>' + (s ? '<span class="cto-ts">' + esc(s) + '</span>' : '') + '</div>';
  };
  var tiles = function (a) { return '<div class="cto-tiles">' + a.join('') + '</div>'; };
  var sec = function (title, body, hint, cls) {
    return '<section class="cto-sec' + (cls ? ' ' + cls : '') + '"><header><h2>' + esc(title) + '</h2>' + (hint ? '<p>' + esc(hint) + '</p>' : '') + '</header>' + body + '</section>';
  };
  var cols = function (a) { return '<div class="cto-cols">' + a.join('') + '</div>'; };
  var note = function (t) { return '<p class="cto-note">' + esc(t) + '</p>'; };
  var empty = function (t) { return '<p class="cto-empty">' + esc(t) + '</p>'; };
  var na = function (x, fn, label) { return x == null ? note((label || 'Data') + ' is unavailable right now.') : fn(x); };
  function tbl(head, rows, none) {
    if (!rows.length) return empty(none || 'Nothing to show.');
    var cell = function (c) { return c && c.h != null ? c.h : esc(c); };
    return '<div class="cto-wrap"><table class="cto-tbl"><thead><tr>' + head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + cell(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function bars(items) {
    var mx = Math.max.apply(null, items.map(function (i) { return i.value; }).concat(1));
    return items.map(function (i) {
      return '<div class="cto-br"><span>' + esc(i.label) + '</span><div class="cto-bt"><i class="t-' + (i.tone || 'ok') + '" style="width:' + i.value / mx * 100 + '%"></i></div><b>' + num(i.value) + '</b></div>';
    }).join('');
  }

  // ---- live refresh: capture and replay RD's own request --------------------------------
  var rawFetch = window.fetch.bind(window), last = null;
  window.fetch = function (input, init) {
    try {
      var u = typeof input === 'string' ? input : (input && input.url) || '';
      if (u.indexOf('action=role-dashboard') > -1) last = { input: typeof input === 'string' ? input : input.clone(), init: init };
    } catch (e) {}
    return rawFetch(input, init);
  };
  function unwrap(j) {
    if (!j || typeof j !== 'object') return null;
    if (j.integrations) return j;
    for (var k in j) if (j[k] && typeof j[k] === 'object' && j[k].integrations) return j[k];
    return null;
  }
  function pull() {
    var inp = typeof last.input === 'string' ? last.input : last.input.clone();
    return rawFetch(inp, Object.assign({}, last.init, { cache: 'no-store' }))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { var d = unwrap(j); if (!d) throw new Error('Unexpected response'); return d; });
  }
  function sample(d, net) {
    var db = d && d.database;
    st.buf.push({ t: Date.now(), ms: db && db.ok && db.latencyMs != null ? db.latencyMs : null, net: !!net });
    if (st.buf.length > MAX) st.buf.shift();
  }
  function tick() {
    clearTimeout(st.timer);
    if (st.noLive || st.paused || document.hidden) return;
    st.timer = setTimeout(refresh, st.every * 1000 * Math.min(4, 1 + st.fails));
  }
  function refresh() {
    if (st.busy || st.noLive) return;
    st.busy = true; status();
    return pull()
      .then(function (d) { st.fails = 0; st.d = d; st.at = Date.now(); sample(d); })
      .catch(function () { st.fails++; sample(null, true); })
      .then(function () { st.busy = false; paint(); tick(); });
  }
  function paint() {
    var r = $('cto-root'); if (!r || !st.d) return;
    var ae = document.activeElement, key = ae && ae.id ? '#' + ae.id : ae && ae.dataset && ae.dataset.tab ? '[data-tab="' + ae.dataset.tab + '"]' : ae && ae.dataset && ae.dataset.a ? '[data-a="' + ae.dataset.a + '"]' : '';
    r.innerHTML = build(st.d);
    if (key) { var n = r.querySelector(key); if (n) n.focus(); }
    status();
  }
  function status() {
    var el = $('cto-state'), dot = document.querySelector('.cto-dot'); if (!el || !dot) return;
    var s = Math.round((Date.now() - st.at) / 1000), age = s < 3 ? 'just now' : s < 90 ? s + 's ago' : Math.round(s / 60) + 'm ago';
    dot.className = 'cto-dot ' + (st.noLive || st.paused ? 'off' : st.fails ? 'err' : 'on');
    el.textContent = st.noLive ? 'Snapshot from page load, updated ' + age : st.paused ? 'Paused, updated ' + age : st.fails ? 'Connection lost, retrying' : st.busy ? 'Refreshing' : 'Live, updated ' + age;
  }
  function tip(e) {
    var tp = $('cto-tip'), cu = $('cto-cur'); if (!tp || !cu) return;
    var p = e.target.closest ? e.target.closest('.cto-plot') : null;
    if (!p) { tp.hidden = cu.hidden = true; return; }
    var rc = p.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - rc.left) / rc.width)), n = st.buf.length;
    var i = n < 2 ? 0 : Math.round(f * (n - 1)), s = st.buf[i], x = n < 2 ? 50 : i / (n - 1) * 100;
    tp.hidden = cu.hidden = false;
    cu.style.left = tp.style.left = x + '%';
    tp.style.transform = f > 0.65 ? 'translateX(calc(-100% - 8px))' : 'translateX(8px)';
    tp.textContent = new Date(s.t).toLocaleTimeString() + ': ' + (s.ms != null ? s.ms + ' ms' : s.net ? 'no response' : 'database unreachable');
  }
  function wire() {
    if (!last) st.noLive = true;
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-tab],[data-a]') : null;
      if (!t) return;
      if (t.dataset.tab) { st.tab = t.dataset.tab; paint(); }
      else if (t.dataset.a === 'now') refresh();
      else { st.paused = !st.paused; if (st.paused) clearTimeout(st.timer); else refresh(); paint(); }
    });
    document.addEventListener('change', function (e) { if (e.target.id === 'cto-int') { st.every = +e.target.value; tick(); } });
    document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(st.timer); else if (!st.noLive && !st.paused) refresh(); });
    document.addEventListener('pointermove', tip);
    setInterval(status, 1000);
    paint(); tick();
  }

  // ---- derived views ------------------------------------------------------------------
  function deps(d) { return d.deployments && d.deployments.configured ? d.deployments.deployments || [] : []; }

  // Tolerant of the shape services.uptimeRobot() returns: { monitors|list: [...] } or a bare array.
  function mons(u) {
    var arr = !u ? [] : Array.isArray(u) ? u : u.monitors || u.list || [];
    return arr.map(function (m) {
      var s = m.status, t = String(s == null ? '' : s);
      var state = typeof s === 'number' ? (s === 2 ? 'up' : s === 8 || s === 9 ? 'down' : s === 0 ? 'paused' : 'unknown') : /down/i.test(t) ? 'down' : /pause/i.test(t) ? 'paused' : /up|ok|operational/i.test(t) ? 'up' : 'unknown';
      var r = parseFloat(m.uptime != null ? m.uptime : m.uptimeRatio != null ? m.uptimeRatio : m.ratio != null ? m.ratio : m.custom_uptime_ratio);
      return { name: m.name || m.friendlyName || m.friendly_name || m.label || 'Monitor', state: state, ratio: isFinite(r) ? r : null };
    });
  }

  function issues(d) {
    var o = [], add = function (t, m) { o.push({ t: t, m: m }); };
    var ds = deps(d), dep = ds[0], miss = (d.integrations || []).filter(function (i) { return !i.configured; });
    if (!d.database || !d.database.ok) add('bad', 'Database is unreachable');
    else if (d.database.latencyMs > 800) add('warn', 'Database is slow (' + d.database.latencyMs + ' ms)');
    if (dep && dep.state === 'ERROR') add('bad', 'Latest deployment failed');
    else if (dep && dep.state !== 'READY') add('warn', 'Latest deployment is ' + String(dep.state).toLowerCase());
    if (d.maintenance && d.maintenance.on) add('warn', 'Storefront is in maintenance mode');
    if (miss.length) add('warn', miss.length + ' integration' + (miss.length > 1 ? 's' : '') + ' not configured: ' + miss.map(function (i) { return i.label; }).join(', '));
    var l = d.logins, ip = l && l.topIps && l.topIps[0];
    if (ip && ip.count >= 5) add('bad', ip.count + ' failed sign-ins from ' + ip.label + ' in 7 days');
    else if (l && l.total >= 5 && l.failed / l.total > 0.25) add('warn', 'High failed sign-in rate: ' + l.failed + ' of ' + l.total);
    var a = d.aiHealth;
    if (a && a.requests >= 5 && a.failures / a.requests >= 0.1) add('warn', 'AI error rate is ' + Math.round(a.failures / a.requests * 100) + '%');
    var ac = d.accounts;
    if (ac && ac.faceLocked) add('warn', ac.faceLocked + ' account' + (ac.faceLocked > 1 ? 's' : '') + ' face-locked');
    mons(d.uptime).forEach(function (m) { if (m.state === 'down') add('bad', m.name + ' is down'); });
    var rej = (d.appBuilds ? d.appBuilds.list : []).filter(function (b) { return b.status === 'rejected'; });
    if (rej.length) add('warn', rej.length + ' rejected app build' + (rej.length > 1 ? 's' : ''));
    return o;
  }

  function kpis(a) { return '<dl class="cto-kpis">' + a.map(function (k) { return '<div><dt>' + k[0] + '</dt><dd>' + k[1] + '</dd></div>'; }).join('') + '</dl>'; }

  // Live database latency: one reading per refresh, rolling window of the last MAX readings.
  function latency() {
    var b = st.buf, n = b.length, v = b.map(function (p) { return p.ms; }).filter(function (x) { return x != null; });
    if (!v.length) return empty(n ? 'No successful database readings yet.' : 'Waiting for the first reading.');
    var hi = Math.max.apply(null, v) * 1.25 || 1;
    var X = function (i) { return n < 2 ? 50 : i / (n - 1) * 100; }, Y = function (m) { return 96 - m / hi * 92; };
    var segs = [], cur = null, ticks = '';
    b.forEach(function (p, i) {
      if (p.ms == null) { cur = null; ticks += '<i class="cto-x" style="left:' + X(i) + '%"></i>'; return; }
      if (!cur) segs.push(cur = []);
      cur.push(X(i).toFixed(2) + ' ' + Y(p.ms).toFixed(2));
    });
    var line = segs.map(function (s) { return 'M' + s.join('L'); }).join('');
    var area = segs.map(function (s) { return 'M' + s[0].split(' ')[0] + ' 100L' + s.join('L') + 'L' + s[s.length - 1].split(' ')[0] + ' 100Z'; }).join('');
    var lp = b[n - 1], dot = lp.ms == null ? '' : '<i class="cto-pt" style="left:' + X(n - 1) + '%;top:' + Y(lp.ms) + '%"></i>';
    var s = v.slice().sort(function (a, c) { return a - c; }), avg = Math.round(v.reduce(function (a, c) { return a + c; }, 0) / v.length);
    return '<div class="cto-plot" role="img" aria-label="Database latency over the last ' + n + ' readings, latest ' + (lp.ms == null ? 'unavailable' : lp.ms + ' milliseconds') + '">' +
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="cto-ar" d="' + area + '"/><path class="cto-ln" d="' + line + '"/></svg>' +
      '<span class="cto-yl" style="top:2px">' + Math.round(hi) + ' ms</span><span class="cto-yl" style="bottom:2px">0</span>' + ticks + dot +
      '<i class="cto-cur" id="cto-cur" hidden></i><span class="cto-tip" id="cto-tip" hidden></span></div>' +
      '<div class="cto-xl"><span>' + hm(b[0].t) + '</span><span>Now</span></div>' +
      kpis([['Now', lp.ms == null ? '—' : lp.ms + ' ms'], ['Average', avg + ' ms'], ['95th percentile', s[Math.min(s.length - 1, Math.ceil(s.length * 0.95) - 1)] + ' ms'], ['Peak', s[s.length - 1] + ' ms'], ['Readings', n]]);
  }

  // Hourly stacked bars (successful + failed) for the last 24 hours.
  function hours(h, okL, badL) {
    if (!h) return empty('No data for the last 24 hours.');
    var tot = h.ok.map(function (v, i) { return v + h.failed[i]; }), mx = Math.max.apply(null, tot.concat(1));
    var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); }, ok = sum(h.ok), bad = sum(h.failed), all = ok + bad;
    var cs = h.ok.map(function (v, i) {
      var f = h.failed[i];
      return '<div class="cto-col" title="' + hm(h.start + i * HOUR) + ': ' + v + ' ' + okL + ', ' + f + ' ' + badL + '">' +
        '<i class="cto-seg f" style="height:' + f / mx * 100 + '%;min-height:' + (f ? 2 : 0) + 'px"></i>' +
        '<i class="cto-seg" style="height:' + v / mx * 100 + '%;min-height:' + (v ? 2 : 0) + 'px"></i></div>';
    }).join('');
    var xl = [0, 6, 12, 18].map(function (i) { return '<span>' + hm(h.start + i * HOUR) + '</span>'; }).join('') + '<span>Now</span>';
    var peak = tot.indexOf(Math.max.apply(null, tot));
    return '<div class="cto-bars" role="img" aria-label="Hourly ' + okL + ' and ' + badL + ' counts, last 24 hours">' + cs + '</div><div class="cto-xl">' + xl + '</div>' +
      kpis([['Total', num(all)], [cap(okL), num(ok)], [cap(badL), num(bad)], ['Failure rate', all ? (bad / all * 100).toFixed(1) + '%' : '0%'], ['Busiest hour', all ? hm(h.start + peak * HOUR) : '—']]);
  }

  // ---- page ---------------------------------------------------------------------------
  function build(d) {
    var ds = deps(d), dep = ds[0] || null, iss = issues(d), ab = d.appBuilds, ints = d.integrations || [];
    var worst = iss.some(function (i) { return i.t === 'bad'; }) ? 'bad' : iss.length ? 'warn' : 'ok';
    var good = ds.filter(function (x) { return x.state === 'READY'; }).length, rate = ds.length ? good / ds.length : null;
    var intOk = ints.filter(function (i) { return i.configured; }).length;

    var bar = '<div class="cto-bar"><span class="cto-live"><i class="cto-dot on"></i><span id="cto-state">Live</span></span><span class="cto-sp"></span>' +
      (st.noLive ? '' : '<label>Refresh every <select id="cto-int" class="cto-btn">' + [10, 30, 60].map(function (s) { return '<option value="' + s + '"' + (s === st.every ? ' selected' : '') + '>' + s + ' seconds</option>'; }).join('') + '</select></label>' +
        '<button type="button" class="cto-btn" data-a="pause">' + (st.paused ? 'Resume' : 'Pause') + '</button><button type="button" class="cto-btn go" data-a="now">Refresh now</button>') + '</div>';

    var hero = '<section class="cto-hero t-' + worst + '" aria-label="System status"><h2>' + { ok: 'All systems operational', warn: 'Needs attention', bad: 'Action required' }[worst] + '</h2>' +
      (iss.length ? '<ul class="cto-issues">' + iss.map(function (i) { return '<li class="t-' + i.t + '">' + esc(i.m) + '</li>'; }).join('') + '</ul>' : '<p>No issues found across database, deployments, security, integrations and AI.</p>') + '</section>';

    var top = tiles([
      tile('Database', d.database && d.database.ok ? 'Reachable' : 'Unreachable', d.database && d.database.latencyMs != null ? d.database.latencyMs + ' ms round trip' : '', d.database && d.database.ok ? 'ok' : 'bad'),
      tile('Latest deployment', dep ? dep.state : (d.deployments && !d.deployments.configured ? 'Not connected' : '—'), dep ? ago(dep.createdAt) : '', dep ? dtone(dep.state) : ''),
      tile('Deploy success', rate == null ? '—' : Math.round(rate * 100) + '%', ds.length ? good + ' of ' + ds.length + ' recent' : '', rate == null ? '' : rate === 1 ? 'ok' : rate >= 0.8 ? 'warn' : 'bad'),
      tile('Integrations connected', intOk + ' of ' + ints.length, '', intOk === ints.length ? 'ok' : 'warn'),
      tile('Failed sign-ins (7 days)', d.logins ? num(d.logins.failed) : '—', d.logins ? 'of ' + num(d.logins.total) + ' attempts' : '', d.logins && d.logins.failed ? 'warn' : ''),
      tile('AI errors (7 days)', d.aiHealth ? num(d.aiHealth.failures) : '—', d.aiHealth ? 'of ' + num(d.aiHealth.requests) + ' requests' : '', d.aiHealth && d.aiHealth.failures ? 'warn' : ''),
      tile('Storefront', d.maintenance ? (d.maintenance.on ? 'Maintenance on' : 'Live') : '—', d.maintenance && d.maintenance.on ? d.maintenance.reason : '', d.maintenance ? (d.maintenance.on ? 'bad' : 'ok') : ''),
      tile('App builds live', ab ? num(ab.live) : '—', ab ? num(ab.inProgress) + ' in progress' : '', '')
    ]);

    var tabs = [['lat', 'Database latency'], ['in', 'Sign-ins (24h)'], ['ai', 'AI requests (24h)']].map(function (t) {
      return '<button type="button" class="cto-tab" data-tab="' + t[0] + '" aria-pressed="' + (st.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    var chart = st.tab === 'in' ? hours(d.logins && d.logins.hourly, 'successful', 'failed') : st.tab === 'ai' ? hours(d.aiHealth && d.aiHealth.hourly, 'successful', 'failed') : latency();
    var live = sec('Live activity', '<div class="cto-tabs" role="group" aria-label="Chart view">' + tabs + '</div>' + chart, st.tab === 'lat' ? 'One database reading per refresh' : 'Hourly totals, last 24 hours', 'light');

    var deploys = na(d.deployments, function (x) {
      if (!x.configured) return note(x.message);
      return tbl(['State', 'Target', 'When', 'Commit', 'Link'], (x.deployments || []).map(function (y) {
        var link = /^[\w.-]+$/.test(y.url || '') ? raw('<a class="cto-link" href="https://' + esc(y.url) + '" target="_blank" rel="noopener noreferrer">Open</a>') : '—';
        return [raw(pill(y.state, dtone(y.state))), y.target, ago(y.createdAt), y.commitMessage || '—', link];
      }), 'Vercel returned no deployments.');
    }, 'Deployments');

    var integrations = tbl(['Service', 'Status'], ints.map(function (i) {
      return [i.label, raw(i.configured ? pill('Connected', 'ok') : pill('Missing ' + i.missing.join(', '), 'warn'))];
    }), 'No integrations to check.');

    var uptime = na(d.uptime, function (u) {
      if (u.configured === false) return note(u.message || 'Uptime monitoring is not connected.');
      return tbl(['Monitor', 'Status', 'Uptime'], mons(u).map(function (m) {
        return [m.name, raw(pill(cap(m.state), m.state === 'up' ? 'ok' : m.state === 'down' ? 'bad' : 'warn')), m.ratio == null ? '—' : m.ratio.toFixed(2) + '%'];
      }), 'No monitors returned.');
    }, 'Uptime');

    var security = na(d.logins, function (l) {
      var acc = d.accounts;
      var accountLine = acc ? tiles([
        tile('Active accounts', num(acc.active)),
        tile('Face enrolled', num(acc.faceEnrolled) + ' of ' + num(acc.active), '', acc.faceEnrolled < acc.active ? 'warn' : 'ok'),
        tile('Face-locked', num(acc.faceLocked), '', acc.faceLocked ? 'bad' : 'ok')
      ]) : '';
      var ips = l.topIps && l.topIps.length ? bars(l.topIps.map(function (x) { return { label: x.label, value: x.count, tone: x.count >= 5 ? 'bad' : 'warn' }; })) : '';
      var fails = tbl(['When', 'Username tried', 'IP'], l.recentFailures.map(function (f) { return [ago(f.at), f.username || '—', f.ip || '—']; }), 'No failed sign-ins in the last 7 days.');
      return accountLine + ips + fails;
    }, 'Security data');

    var ai = na(d.aiHealth, function (a) {
      if (!a.failures) return empty(a.requests ? 'No AI errors in the last 7 days.' : 'No AI requests logged in the last 7 days.');
      return bars(a.topErrors.map(function (x) { return { label: x.label, value: x.count, tone: 'bad' }; }));
    }, 'AI health');

    var apps = na(ab, function (a) {
      return tbl(['Platform', 'Version', 'Status', 'Released', 'Notes'], a.list.map(function (b) {
        return [b.platform === 'ios' ? 'iOS' : 'Android', b.version, raw(pill(cap(b.status), b.status === 'live' ? 'ok' : b.status === 'rejected' ? 'bad' : 'warn')), b.releasedOn || '—', b.notes || '—'];
      }), 'No app builds recorded yet.');
    }, 'App releases');

    return bar + hero + top + live +
      sec('Recent deployments', deploys, 'Vercel') +
      cols([sec('Uptime monitors', uptime, 'Live status'), sec('Integrations', integrations, 'Only whether each is set — never the keys')]) +
      cols([sec('Security', security, 'Last 7 days'), sec('Most common AI errors', ai, 'Last 7 days')]) +
      sec('App releases', apps, 'Android and iOS builds');
  }

  RD.boot({
    role: 'CTO',
    render: function (d) {
      st.d = d;
      if (Date.now() - st.at > 2000) sample(d);
      st.at = Date.now();
      if (!st.wired) { st.wired = true; setTimeout(wire, 0); }
      return '<div id="cto-root">' + build(d) + '</div>';
    }
  });
})();
</script>
</body>
</html>
