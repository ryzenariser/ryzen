<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>CTO Dashboard — Razariser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css" />
</head>
<body>
<div id="rd-app"></div>
<script src="_shared.js"></script>
<script>
// CTO dashboard. Data comes from Roles-dashboard.js/CTO.js via
// /api/admin?action=role-dashboard — this file only decides how it looks.
RD.boot({
  role: 'CTO',
  render: function (d) {
    var R = RD, esc = R.esc, inr = R.inr, num = R.num, pct = R.pct, ago = R.ago, html = R.html, when = R.when;
    var dep = d.deployments && d.deployments.configured && d.deployments.deployments.length ? d.deployments.deployments[0] : null;
    var intOk = d.integrations.filter(function (i) { return i.configured; }).length;
    var tiles = R.grid([
      R.stat('Database', d.database && d.database.ok ? 'Reachable' : 'Unreachable', d.database && d.database.latencyMs != null ? d.database.latencyMs + ' ms round trip' : '', d.database && d.database.ok ? 'ok' : 'bad'),
      R.stat('Latest deployment', dep ? dep.state : (d.deployments && !d.deployments.configured ? 'Not connected' : '—'), dep ? ago(dep.createdAt) : '', dep ? (dep.state === 'READY' ? 'ok' : dep.state === 'ERROR' ? 'bad' : 'warn') : ''),
      R.stat('Integrations connected', intOk + ' of ' + d.integrations.length, '', intOk === d.integrations.length ? 'ok' : 'warn'),
      R.stat('Failed sign-ins (7 days)', d.logins ? num(d.logins.failed) : '—', d.logins ? 'of ' + num(d.logins.total) + ' attempts' : '', d.logins && d.logins.failed ? 'warn' : ''),
      R.stat('AI errors (7 days)', d.aiHealth ? num(d.aiHealth.failures) : '—', d.aiHealth ? 'of ' + num(d.aiHealth.requests) + ' requests' : '', d.aiHealth && d.aiHealth.failures ? 'warn' : ''),
      R.stat('Storefront', d.maintenance ? (d.maintenance.on ? 'Maintenance on' : 'Live') : '—', d.maintenance && d.maintenance.on ? d.maintenance.reason : '', d.maintenance && d.maintenance.on ? 'bad' : 'ok'),
    ]);

    var deploys = R.na(d.deployments, function (x) {
      if (!x.configured) return R.note(esc(x.message));
      return R.table(['State', 'Target', 'When', 'Commit'], x.deployments.map(function (y) {
        return [html(R.pill(y.state, y.state === 'READY' ? 'ok' : y.state === 'ERROR' ? 'bad' : 'warn')), y.target, ago(y.createdAt), y.commitMessage || '—'];
      }), 'Vercel returned no deployments.');
    }, 'Deployments');

    var integrations = R.table(['Service', 'Status'], d.integrations.map(function (i) {
      return [i.label, html(i.configured ? R.pill('Connected', 'ok') : R.pill('Missing ' + i.missing.join(', '), 'warn'))];
    }));

    var security = R.na(d.logins, function (l) {
      var acc = d.accounts;
      var accountLine = acc ? R.grid([
        R.stat('Active accounts', num(acc.active)),
        R.stat('Face enrolled', num(acc.faceEnrolled) + ' of ' + num(acc.active), '', acc.faceEnrolled < acc.active ? 'warn' : 'ok'),
        R.stat('Face-locked', num(acc.faceLocked), '', acc.faceLocked ? 'bad' : 'ok'),
      ]) : '';
      var fails = R.table(['When', 'Username tried', 'IP'], l.recentFailures.map(function (f) { return [ago(f.at), f.username || '—', f.ip || '—']; }), 'No failed sign-ins in the last 7 days.');
      return accountLine + '<div style="height:14px"></div>' + fails;
    }, 'Security data');

    var ai = R.na(d.aiHealth, function (a) {
      if (!a.failures) return R.empty(a.requests ? 'No AI errors in the last 7 days.' : 'No AI requests logged in the last 7 days.');
      return R.bars(a.topErrors.map(function (e) { return { label: e.label, value: e.count, tone: 'bad' }; }));
    }, 'AI health');

    return tiles + R.section('Recent deployments', deploys, 'Vercel') +
      R.cols(2, [R.section('Integrations', integrations, 'Only whether each is set — never the keys'), R.section('Security', security, 'Last 7 days')]) +
      R.section('Most common AI errors', ai, 'Last 7 days');
  }
});
</script>
</body>
</html>
