<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#011207" />
<title>CTO Operations Center — Razariser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css" />
<style>
/* Near-Black Green page, Dark Forest Green surfaces, Soft Sage Mint text and chart panels, Apple Green accent.
   Amber and coral appear only for warnings and failures. */
:root{--cto-bg:#011207;--cto-card:#012F13;--cto-mint:#E2F0CC;--cto-apple:#8BC53D;--cto-warn:#F0C24B;--cto-bad:#FF7A6B;--cto-line:rgba(226,240,204,.14);--cto-dim:rgba(226,240,204,.68)}
html{color-scheme:dark}
html,body,#rd-app{background:var(--cto-bg)!important;color:var(--cto-mint)}
::selection{background:var(--cto-apple);color:var(--cto-bg)}
#cto-root{max-width:1200px;margin:0 auto;padding:0 0 40px;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
#cto-root h2,#cto-root p,#cto-root dl,#cto-root dd{margin:0}
.t-ok{--tone:var(--cto-apple)}
.t-warn{--tone:var(--cto-warn)}
.t-bad{--tone:var(--cto-bad)}
.cto-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px;font-size:13px;color:var(--cto-dim)}
.cto-sp{flex:1}
.cto-live{display:inline-flex;align-items:center;gap:8px;color:var(--cto-mint)}
.cto-dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--cto-apple)}
.cto-dot.on{animation:cto-pulse 2s infinite}
.cto-dot.err{background:var(--cto-bad)}
.cto-dot.off{background:var(--cto-dim)}
@keyframes cto-pulse{0%{box-shadow:0 0 0 0 rgba(139,197,61,.55)}100%{box-shadow:0 0 0 8px rgba(139,197,61,0)}}
.cto-btn,.cto-tab{font:inherit;font-size:13px;font-weight:500;color:var(--cto-mint);background:transparent;border:1px solid rgba(226,240,204,.3);border-radius:8px;padding:6px 14px;min-height:36px;cursor:pointer}
.cto-btn:hover,.cto-tab:hover{background:rgba(226,240,204,.08)}
.cto-btn:focus-visible,.cto-tab:focus-visible,.cto-find input:focus-visible,a:focus-visible{outline:2px solid var(--cto-apple);outline-offset:2px}
.cto-btn.go{background:var(--cto-apple);border-color:var(--cto-apple);color:var(--cto-bg);font-weight:600}
.cto-btn.go:hover{background:#9bd14c}
.cto-find{display:flex;gap:8px;margin:0 0 16px}
.cto-find input{flex:1;min-width:0;font:inherit;color:var(--cto-mint);background:var(--cto-card);border:1px solid rgba(226,240,204,.3);border-radius:8px;padding:8px 12px;min-height:36px}
.cto-crumb{margin:0 0 14px;font-size:13px;color:var(--cto-dim)}
.cto-crumb a,.cto-link{color:var(--cto-apple);text-decoration:underline;text-underline-offset:3px}
.cto-hero{background:var(--cto-card);border:1px solid var(--cto-line);border-left:4px solid var(--tone);border-radius:14px;padding:16px 20px;margin:0 0 16px}
.cto-hero h2{font:700 22px/1.25 'Playfair Display',Georgia,serif}
.cto-hero p{margin-top:4px;color:var(--cto-dim)}
.cto-issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.cto-issues li{position:relative;padding-left:18px}
.cto-issues li:before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--tone)}
.cto-issues .cto-link{color:inherit}
.cto-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.cto-tile{display:flex;flex-direction:column;gap:2px;background:var(--cto-card);border:1px solid var(--cto-line);border-radius:14px;padding:14px 16px;box-shadow:inset 3px 0 0 var(--tone,transparent);color:inherit;text-decoration:none}
a.cto-tile:hover{border-color:var(--cto-apple)}
.cto-tl,.cto-ts{font-size:12px;color:var(--cto-dim)}
.cto-tv{font-size:22px;font-weight:600;line-height:1.25;color:var(--tone,var(--cto-mint))}
.cto-sec{background:var(--cto-card);border:1px solid var(--cto-line);border-radius:16px;padding:18px 20px;margin:0 0 16px;min-width:0}
.cto-sec .cto-tile{background:rgba(1,18,7,.55)}
.cto-sec .cto-tiles{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.cto-sec>header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin:0 0 14px}
.cto-sec h2{font:700 18px/1.3 'Playfair Display',Georgia,serif}
.cto-sec>header p{font-size:12px;color:var(--cto-dim)}
.cto-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin:0 0 16px}
.cto-cols>.cto-sec{margin:0}
.cto-more{margin:-4px 0 16px}
.cto-sec.light{background:var(--cto-mint);color:var(--cto-card);border-color:transparent}
.light>header p{color:rgba(1,47,19,.7)}
.light .cto-link,.light .cto-crumb a{color:var(--cto-card)}
.cto-tabs,.cto-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.cto-tab{border-radius:999px}
.cto-tab[aria-pressed="true"]{background:var(--cto-apple);border-color:var(--cto-apple);color:var(--cto-bg)}
.light .cto-tab{color:var(--cto-card);border-color:rgba(1,47,19,.35)}
.light .cto-tab:hover{background:rgba(1,47,19,.08)}
.light .cto-tab[aria-pressed="true"]{background:var(--cto-card);border-color:var(--cto-card);color:var(--cto-mint)}
.light .cto-tab:focus-visible{outline-color:var(--cto-card)}
.cto-plot{position:relative;height:200px;cursor:pointer;touch-action:pan-y;border-bottom:1px solid rgba(1,47,19,.35);background:linear-gradient(rgba(1,47,19,.12) 1px,transparent 1px) 0 0/100% 25%}
.cto-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cto-plot path{vector-effect:non-scaling-stroke}
.cto-ln{fill:none;stroke:var(--cto-card);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cto-ar{fill:var(--cto-apple);opacity:.5;stroke:none}
.cto-pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cto-card);box-shadow:0 0 0 4px rgba(139,197,61,.7)}
.cto-x{position:absolute;bottom:0;width:3px;height:16px;margin-left:-1px;background:#C8372D}
.cto-cur{position:absolute;top:0;bottom:0;width:1px;background:var(--cto-card);opacity:.45;pointer-events:none}
.cto-tip{position:absolute;top:6px;z-index:2;padding:5px 9px;border-radius:6px;background:var(--cto-bg);color:var(--cto-mint);font-size:12px;white-space:nowrap;pointer-events:none}
.cto-tip[hidden],.cto-cur[hidden]{display:none}
.cto-yl{position:absolute;left:4px;font-size:11px;opacity:.7}
.cto-xl{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;opacity:.7}
.cto-bars{display:flex;align-items:flex-end;gap:3px;height:200px;border-bottom:1px solid rgba(1,47,19,.35)}
.cto-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.cto-seg{display:block;background:var(--cto-card);border-radius:2px 2px 0 0}
.cto-seg.f{background:#C8372D}
.cto-kpis{display:flex;flex-wrap:wrap;gap:10px 28px;margin:14px 0 0}
.cto-kpis dt,.cto-kv dt{font-size:12px;opacity:.7}
.cto-kpis dd{margin:2px 0 0;font-size:20px;font-weight:600}
.cto-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px}
.cto-kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.cto-gap{height:14px}
.cto-wrap{overflow-x:auto}
.cto-tbl{width:100%;border-collapse:collapse;font-size:13px}
.cto-tbl th{padding:0 10px 8px 0;text-align:left;font-size:12px;font-weight:500;color:var(--cto-dim);white-space:nowrap}
.cto-tbl td{padding:10px 10px 10px 0;border-top:1px solid var(--cto-line);vertical-align:top;overflow-wrap:anywhere}
.cto-go{cursor:pointer}
.cto-go:hover td{background:rgba(226,240,204,.06)}
.cto-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--tone);background:color-mix(in srgb,var(--tone) 16%,transparent);border:1px solid color-mix(in srgb,var(--tone) 40%,transparent)}
.cto-note,.cto-empty{color:var(--cto-dim)}
.cto-empty{padding:20px 0;text-align:center}
.light .cto-empty{color:rgba(1,47,19,.7)}
.cto-un{padding:12px 14px;margin:0 0 10px;border:1px dashed rgba(226,240,204,.3);border-radius:10px;color:var(--cto-dim)}
.cto-un b{margin-right:6px;color:var(--cto-warn)}
.light .cto-un{border-color:rgba(1,47,19,.35);color:rgba(1,47,19,.85)}
.light .cto-un b{color:#8a5a00}
.cto-br{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:0 0 12px}
.cto-br>span{grid-column:1/-1;font-size:13px;overflow-wrap:anywhere}
.cto-bt{height:8px;border-radius:99px;background:rgba(226,240,204,.1);overflow:hidden}
.cto-bt i{display:block;height:100%;border-radius:99px;background:var(--tone,var(--cto-apple))}
.cto-br b{font-weight:600}
.cto-nav{display:flex;gap:4px;overflow-x:auto;margin:0 0 12px;padding:0 0 4px;border-bottom:1px solid var(--cto-line);scrollbar-width:thin}
.cto-nav a{flex:none;padding:8px 12px;border-radius:8px;color:var(--cto-dim);text-decoration:none;font-size:13px;font-weight:500}
.cto-nav a:hover{color:var(--cto-mint);background:rgba(226,240,204,.06)}
.cto-nav a[aria-current="page"]{color:var(--cto-bg);background:var(--cto-apple);font-weight:600}
.cto-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-6px 0 16px}
.cto-toast{padding:4px 10px;border-radius:6px;background:var(--cto-apple);color:var(--cto-bg);font-size:12px;font-weight:600}
.cto-toast[hidden]{display:none}
.cto-setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 10px}
.cto-set{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cto-set input[type=number]{width:90px;font:inherit;color:var(--cto-mint);background:var(--cto-bg);border:1px solid rgba(226,240,204,.3);border-radius:8px;padding:6px 8px;min-height:36px}
.cto-set input[type=checkbox]{width:18px;height:18px;accent-color:var(--cto-apple)}
.cto-tbl th{cursor:pointer}
.cto-tbl th.ns{cursor:default}
.cto-tbl th[aria-sort="ascending"]:after{content:" \2191"}
.cto-tbl th[aria-sort="descending"]:after{content:" \2193"}
#cto-root.wall{font-size:16px}
#cto-root.wall .cto-nav,#cto-root.wall .cto-find{display:none}
#cto-root.wall .cto-tiles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
#cto-root.wall .cto-tv{font-size:34px}
@media print{html,body,#rd-app{background:#fff!important;color:#000!important}.cto-nav,.cto-find,.cto-tools,.cto-bar select,.cto-bar button,.cto-tabs,.cto-chips{display:none!important}.cto-sec,.cto-sec.light,.cto-tile,.cto-hero{background:#fff!important;color:#000!important;border:1px solid #999!important;break-inside:avoid}.cto-tv,.cto-tl,.cto-ts,.cto-note,.cto-empty,.cto-un,.cto-sec>header p,.cto-link,.cto-tbl th,.cto-crumb,.cto-crumb a{color:#000!important}}
@media (max-width:640px){.cto-plot,.cto-bars{height:160px}.cto-sec{padding:16px}.cto-hero{padding:14px 16px}.cto-sp{display:none}}
@media (prefers-reduced-motion:reduce){.cto-dot.on{animation:none}}
</style>
</head>
<body>
<div id="rd-app"></div>
<script src="_shared.js"></script>
<script>
// CTO operations center. Every value comes from Roles-dashboard.js/CTO.js via
// /api/admin?action=role-dashboard (authorised server-side). Nothing here is simulated:
// a source that is not connected shows DATA UNAVAILABLE and names what it needs.
// Live mode re-runs the dashboard request RD.boot already makes (same URL, same auth) on an interval.
(function () {
  'use strict';
  var R = RD, num = R.num, ago = R.ago;
  var esc = function (s) { return R.esc(s == null ? '' : String(s)); };
  var HOUR = 3600000, MAX = 400;
  var RANGES = { '1m': 6e4, '5m': 3e5, '15m': 9e5, '1h': 36e5, '6h': 216e5, '24h': 864e5, '7d': 6048e5, '30d': 2592e6 };
  var SVC = { deploy: 'Deployment', security: 'Security', ai: 'AI', build: 'App build' };
  var st = { buf: [], win: [], range: '5m', sel: null, every: 30, paused: false, fails: 0, at: 0, d: null, busy: false, timer: 0, wired: false, noLive: false, sf: 'all', msg: '', f: { svc: '', prob: false, q: '', since: 0 } };
  var S = '';
  var $ = function (id) { return document.getElementById(id); };
  // Validation: nothing user-facing is ever undefined, null, NaN or Infinity.
  var ok = function (x) { return x != null && x !== '' && !(typeof x === 'number' && !isFinite(x)); };
  var show = function (x, none) { return ok(x) ? String(x) : none || 'Not recorded'; };
  var ms = function (x) { var t = ok(x) ? +new Date(x) : NaN; return isNaN(t) ? 0 : t; };
  var when = function (x) { return ms(x) ? new Date(ms(x)).toLocaleString() : 'Not recorded'; };
  var clock = function (x) { return ms(x) ? new Date(ms(x)).toLocaleTimeString() : '—'; };
  var cap = function (s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };
  var hm = function (t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  var dtone = function (s) { return s === 'READY' ? 'ok' : s === 'ERROR' ? 'bad' : 'warn'; };
  var H = function (v, id) { return '#/' + v + (ok(id) ? '/' + encodeURIComponent(id) : ''); };
  function route() {
    var p = (location.hash || '#/').replace(/^#\/?/, '').split('/'), id = p[1] || '';
    try { id = decodeURIComponent(id); } catch (e) {}
    return { v: p[0] || 'home', id: id };
  }

  // ---- view helpers -------------------------------------------------------------------
  var raw = function (s) { return { h: s }; };
  var lnk = function (href, t) { return '<a class="cto-link" href="' + href + '">' + esc(t) + '</a>'; };
  var pill = function (t, tone) { return '<span class="cto-pill t-' + tone + '">' + esc(t) + '</span>'; };
  var tile = function (l, v, s, tone, href) {
    var c = 'cto-tile' + (tone ? ' t-' + tone : ''), b = '<span class="cto-tl">' + esc(l) + '</span><b class="cto-tv">' + esc(show(v, 'Unavailable')) + '</b>' + (s ? '<span class="cto-ts">' + esc(s) + '</span>' : '');
    return href ? '<a class="' + c + '" href="' + href + '">' + b + '</a>' : '<div class="' + c + '">' + b + '</div>';
  };
  var tiles = function (a) { return '<div class="cto-tiles">' + a.join('') + '</div>'; };
  var stale = function () { return st.at && Date.now() - st.at > st.every * 3000 + 5000; };
  var sec = function (title, body, hint, cls) {
    return '<section class="cto-sec' + (cls ? ' ' + cls : '') + '"><header><h2>' + esc(title) + '</h2><p>' + esc((stale() ? 'STALE DATA. ' : '') + (hint ? hint + '. ' : '') + 'Updated ' + clock(st.at)) + '</p></header>' + body + '</section>';
  };
  var cols = function (a) { return '<div class="cto-cols">' + a.join('') + '</div>'; };
  var note = function (t) { return '<p class="cto-note">' + esc(t) + '</p>'; };
  var empty = function (t) { return '<p class="cto-empty">' + esc(t) + '</p>'; };
  var unavail = function (what, needs) { return '<p class="cto-un"><b>DATA UNAVAILABLE</b>' + esc(what) + ' needs ' + esc(needs) + '. ' + lnk(H('cov'), 'Data sources') + '</p>'; };
  var na = function (x, fn, label) { return x == null ? '<p class="cto-un"><b>MONITORING ERROR</b>' + esc(label) + ' could not be read from the backend.</p>' : fn(x); };
  var crumb = function (a) { return '<nav class="cto-crumb" aria-label="Breadcrumb"><a href="#/">Overview</a>' + a.map(function (x) { return ' / ' + (x[1] ? '<a href="' + x[1] + '">' + esc(x[0]) + '</a>' : '<span>' + esc(x[0]) + '</span>'); }).join('') + '</nav>'; };
  var gone = function (what, back) { return crumb([[what]]) + sec(what, empty('This record is not in the latest data. The dashboard loads the most recent records only.') + '<p class="cto-empty">' + lnk(back, 'Back to the list') + '</p>'); };
  var kv = function (rows) { return '<dl class="cto-kv">' + rows.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + (r[1] && r[1].h != null ? r[1].h : esc(show(r[1]))) + '</dd></div>'; }).join('') + '</dl>'; };
  function tbl(head, rows, none, tos) {
    if (!rows.length) return empty(none || 'Nothing to show.');
    var cell = function (c) { return c && c.h != null ? c.h : esc(show(c, '—')); };
    return '<div class="cto-wrap"><table class="cto-tbl"><thead><tr>' + head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r, i) { return '<tr' + (tos && tos[i] ? ' class="cto-go" data-to="' + tos[i] + '"' : '') + '>' + r.map(function (c) { return '<td>' + cell(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function bars(items) {
    var mx = Math.max.apply(null, items.map(function (i) { return i.value; }).concat(1));
    return items.map(function (i) { return '<div class="cto-br"><span>' + esc(i.label) + '</span><div class="cto-bt"><i class="t-' + (i.tone || 'ok') + '" style="width:' + i.value / mx * 100 + '%"></i></div><b>' + num(i.value) + '</b></div>'; }).join('');
  }
  var btn = function (act, v, label, on) { return '<button type="button" class="cto-tab" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + on + '">' + esc(label) + '</button>'; };

  // ---- live refresh: capture and replay RD's own request ---------------------------------
  var rawFetch = window.fetch.bind(window), last = null;
  window.fetch = function (input, init) {
    try {
      var u = typeof input === 'string' ? input : (input && input.url) || '';
      if (u.indexOf('action=role-dashboard') > -1) last = { input: typeof input === 'string' ? input : input.clone(), init: init };
    } catch (e) {}
    return rawFetch(input, init);
  };
  function unwrap(j) {
    if (!j || typeof j !== 'object') return null;
    if (j.integrations) return j;
    for (var k in j) if (j[k] && typeof j[k] === 'object' && j[k].integrations) return j[k];
    return null;
  }
  function pull() {
    var inp = typeof last.input === 'string' ? last.input : last.input.clone();
    return rawFetch(inp, Object.assign({}, last.init, { cache: 'no-store' }))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { var d = unwrap(j); if (!d) throw new Error('Unexpected response'); return d; });
  }
  function sample(d, net) {
    var db = d && d.database;
    st.buf.push({ t: Date.now(), ms: db && db.ok && ok(db.latencyMs) ? db.latencyMs : null, net: !!net, err: net ? 'The dashboard could not reach the API' : db && !db.ok ? show(db.error, 'Database check failed') : null });
    if (st.buf.length > MAX) st.buf.shift();
  }
  function tick() {
    clearTimeout(st.timer);
    if (st.noLive || st.paused || document.hidden) return;
    st.timer = setTimeout(refresh, st.every * 1000 * Math.min(4, 1 + st.fails));
  }
  function refresh() {
    if (st.busy || st.noLive) return;
    st.busy = true; status();
    return pull()
      .then(function (d) { st.fails = 0; st.d = d; st.at = Date.now(); sample(d); track(d); })
      .catch(function () { st.fails++; sample(null, true); })
      .then(function () { st.busy = false; paint(); tick(); });
  }
  function paint() {
    var r = $('cto-main'); if (!r || !st.d) return;
    var ae = document.activeElement, key = ae && ae.dataset && ae.dataset.act ? '[data-act="' + ae.dataset.act + '"]' + (ae.dataset.v ? '[data-v="' + ae.dataset.v + '"]' : '') : '';
    r.innerHTML = page(st.d); afterPaint();
    if (key) { var n = r.querySelector(key); if (n) n.focus(); }
    status();
  }
  function status() {
    var el = $('cto-state'), dot = document.querySelector('.cto-dot'); if (!el || !dot) return;
    var t = st.at ? new Date(st.at).toLocaleTimeString() : 'never';
    var m = st.noLive ? ['off', 'NOT LIVE (page-load snapshot). Last updated ' + t] : st.paused ? ['off', 'PAUSED. Last updated ' + t] : st.fails ? ['err', 'REAL-TIME CONNECTION LOST. Last successful update ' + t] : stale() ? ['err', 'STALE DATA. Last updated ' + t] : ['on', 'LIVE, polling every ' + st.every + 's. Last updated ' + t];
    dot.className = 'cto-dot ' + m[0]; el.textContent = m[1];

      var list = st.exp || []; if (!list.length) { toast('Nothing to export'); return; }
      var q = function (v) { v = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
      var rows = [['Time', 'Service', 'Severity', 'Event', 'Detail']].concat(list.map(function (e) { return [e.ms ? new Date(e.ms).toISOString() : '', SVC[e.svc], e.sev, e.title, e.sub]; }));
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = 'cto-events-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000); toast('Downloaded ' + list.length + ' rows');
    },
    reset: function () { Object.keys(DEF).forEach(function (k) { cfg[k] = DEF[k]; }); st.every = cfg.every; st.range = cfg.range; save(); var s = $('cto-int'); if (s) s.value = st.every; toast('Defaults restored'); paint(); tick(); }
  };
  function onKey(e) {
    var t = e.target, tag = t && t.tagName;
    if (e.ctrlKey || e.metaKey || e.altKey || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var k = e.key;
    if (gpend && Date.now() - gpend < 1500) { gpend = 0; if (GO.hasOwnProperty(k)) { e.preventDefault(); location.hash = GO[k] ? H(GO[k]) : '#/'; } return; }
    if (k === '/') { e.preventDefault(); var q = $('cto-q'); if (q) q.focus(); }
    else if (k === 'g') gpend = Date.now();
    else if (k === 'r') refresh();
    else if (k === 'w') X.wall();
    else if (k === '?') location.hash = H('settings');
  }
  function wireExtras() {
    document.addEventListener('keydown', onKey);
    document.addEventListener('change', function (e) {
      var t = e.target, k = t.getAttribute && t.getAttribute('data-cfg');
      if (t.id === 'cto-int') { cfg.every = +t.value; save(); return; }
      if (!k) return;
      if (k === 'notify') { cfg.notify = t.checked; if (t.checked && window.Notification && Notification.permission === 'default') Notification.requestPermission(); }
      else { var n = Math.round(+t.value), lo = +t.min, hi = +t.max; cfg[k] = isFinite(n) ? Math.min(hi, Math.max(lo, n)) : DEF[k]; t.value = cfg[k]; }
      save(); toast('Saved in this browser');
    });
  }
  function vSettings() {
    var n = function (k, label, lo, hi, unit) { return '<label class="cto-set"><span>' + label + '</span><input type="number" inputmode="numeric" data-cfg="' + k + '" min="' + lo + '" max="' + hi + '" value="' + cfg[k] + '"> ' + unit + '</label>'; };
    return crumb([['Settings']]) +
      sec('Alert thresholds', '<div class="cto-setgrid">' + n('slowMs', 'Database is slow above', 50, 10000, 'ms') + n('ipFails', 'Flag an IP after', 1, 100, 'failed sign-ins') + n('aiRate', 'Flag AI errors at', 1, 100, '% of requests') + '</div><p class="cto-note">These decide what this dashboard flags as an issue. They are saved in this browser only, not as server-side alert rules.</p>', 'Saved in this browser') +
      sec('Notifications', '<label class="cto-set"><input type="checkbox" data-cfg="notify"' + (cfg.notify ? ' checked' : '') + '> Desktop notification when a critical issue appears</label><p class="cto-note">Browser permission: ' + esc(window.Notification ? Notification.permission : 'not supported here') + '. Works while this tab is open. The tab title always shows the number of open issues.</p>', 'Optional') +
      sec('Keyboard shortcuts', tbl(['Key', 'Action'], [['/', 'Focus search'], ['g, then o d s a p m t e c or ,', 'Go to Overview, Database, Security, AI, Deployments, Mobile, Storefront, Events, Data sources or Settings'], ['r', 'Run health check'], ['w', 'Wall mode for a second screen'], ['?', 'Open this page']]), 'Ignored while typing in a field') +
      '<p class="cto-more"><button type="button" class="cto-btn" data-act="reset">Restore defaults</button></p>';
  }

  RD.boot({
    role: 'CTO',
    render: function (d) {
      st.d = d;
      if (Date.now() - st.at > 2000) sample(d);
      st.at = Date.now();
      track(d);
      if (!st.wired) { st.wired = true; setTimeout(wire, 0); }
      setTimeout(status, 0);
      return '<div id="cto-root"><div id="cto-top">' + top() + '</div><div id="cto-main">' + page(d) + '</div></div>';
    }
  });
})();
</script>
</body>
</html>
