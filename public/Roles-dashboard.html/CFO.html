<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>CFO Dashboard — Razariser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css" />
</head>
<body>
<div id="rd-app"></div>
<script src="_shared.js"></script>
<script>
// CFO dashboard. Data comes from Roles-dashboard.js/CFO.js via
// /api/admin?action=role-dashboard — this file only decides how it looks.
RD.boot({
  role: 'CFO',
  render: function (d) {
    var R = RD, esc = R.esc, inr = R.inr, num = R.num, pct = R.pct, ago = R.ago, html = R.html, when = R.when;
    return R.na(d.orders, function (o) {
      var s = o.summary;
      var tiles = R.grid([
        R.stat('Revenue', inr(s.revenue), 'Paid, shipped and delivered orders'),
        R.stat('Paid orders', num(s.paidCount)),
        R.stat('Average order value', inr(s.avgOrderValue)),
        R.stat('Last 7 days', inr(o.last7.revenue), R.change(o.last7.revenue, o.prev7.revenue)),
        R.stat('Last 30 days', inr(o.last30.revenue), num(o.last30.orders) + ' orders'),
      ]);
      var money = R.grid([
        R.stat('Started, not paid', inr(s.unpaidValue), 'Checkouts still open', s.unpaidValue ? 'warn' : ''),
        R.stat('Refunded', inr(s.refundedValue), '', s.refundedValue ? 'bad' : ''),
        R.stat('Cancelled', inr(s.cancelledValue), '', s.cancelledValue ? 'warn' : ''),
      ]);
      var trend = s.paidCount ? R.trend(o.trend30, 'revenue', inr) : R.empty('No paid orders yet, so there is no revenue trend to draw.');
      var trunc = s.truncated ? R.note('Showing the most recent 5,000 orders only.') : '';
      return tiles + R.section('Revenue, last 30 days', trend, 'Per day') +
        R.cols(2, [R.section('Money not collected', money), R.section('Orders by status', R.statusBars(s.byStatus))]) + trunc;
    }, 'Order data');
  }
});
</script>
</body>
</html>
